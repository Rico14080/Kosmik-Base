name: One-time backend production hardening

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ hashFiles('backend/.apply-production-hardening') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply audited backend invariants
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text(encoding='utf-8')

          old = '''        stock = int(product["stock"])
        reserved = int(product["reserved_stock"] or 0)
        qty = int(item["quantity"])
        if stock > 0 and qty > max(0, stock - reserved):
            raise RuntimeError(f"Insufficient stock: {item['name']}")
    for item in items:
        product = c.execute("SELECT stock FROM products WHERE id=?", (int(item["productId"]),)).fetchone()
        if product and int(product["stock"]) > 0:
            c.execute("UPDATE products SET reserved_stock=reserved_stock+?,updated_at=? WHERE id=?", (int(item["quantity"]), now(), int(item["productId"])))'''
          new = '''        stock = int(product["stock"])
        reserved = int(product["reserved_stock"] or 0)
        qty = int(item["quantity"])
        if qty <= 0:
            raise ValueError(f"Invalid quantity: {item['name']}")
        if stock <= 0:
            raise ValueError(f"Product out of stock: {item['name']}")
        if qty > max(0, stock - reserved):
            raise RuntimeError(f"Insufficient stock: {item['name']}")
    for item in items:
        c.execute("UPDATE products SET reserved_stock=reserved_stock+?,updated_at=? WHERE id=?", (int(item["quantity"]), now(), int(item["productId"])))'''
          if old not in s:
              raise SystemExit('reserve_order_stock target not found; refusing an unsafe partial patch')
          s = s.replace(old, new, 1)

          old = '''                    try:
                        qty = max(1, min(99, int(item.get("quantity", 1))))
                    except (TypeError, ValueError):
                        qty = 1'''
          new = '''                    try:
                        qty = int(item.get("quantity", 0))
                    except (TypeError, ValueError):
                        raise ValueError("Invalid quantity")
                    if qty <= 0 or qty > 99:
                        raise ValueError("Invalid quantity")'''
          if old not in s:
              raise SystemExit('checkout quantity target not found; refusing an unsafe partial patch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          marker = Path('backend/.apply-production-hardening')
          marker.unlink()

      - name: Verify patched backend
        run: |
          python -m py_compile backend/server.py
          python backend/tests/production_inventory_guard_test.py

      - name: Commit audited hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/.apply-production-hardening
          git commit -m "fix: enforce production inventory invariants"
          git push origin HEAD:development
