name: Kosmik Circles CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check expected frontend files
        shell: bash
        run: |
          set -e
          for f in index.html shop.html cart.html gallery.html live.html contact.html us.html admin.html 404.html site.js checkout-fix.js site-fixes.js admin.js admin-ops.js style.css admin.css site.webmanifest robots.txt security.txt; do
            test -f "$f"
          done

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -e
          node --check site.js
          node --check checkout-fix.js
          node --check site-fixes.js
          node --check admin.js
          node --check admin-ops.js

      - name: Validate Python sources when present
        shell: bash
        run: |
          set -e
          files=(backend/server.py backend/backup.py backend/seed_gallery_demo.py backend/seed_temp_image_slots.py backend/tests/smoke_test.py backend/tests/phase1_checkout_test.py check_image_slots.py)
          present=()
          for f in "${files[@]}"; do
            if test -f "$f"; then present+=("$f"); fi
          done
          if [ ${#present[@]} -gt 0 ]; then
            python -m py_compile "${present[@]}"
          fi

      - name: Run Phase 1 checkout regression tests
        shell: bash
        run: |
          set -e
          python backend/tests/phase1_checkout_test.py

      - name: Validate Admin/CSP resource wiring
        shell: bash
        run: |
          set -e
          if grep -nE '<style|style="' admin.html; then
            echo 'Inline Admin style detected.'
            exit 1
          fi
          if grep -n '<script' admin.html | grep -v 'src='; then
            echo 'Inline Admin script detected.'
            exit 1
          fi
          grep -q 'admin.css' admin.html
          grep -q 'admin.js' admin.html
          grep -q 'admin-ops.js' admin.html
          grep -q 'site-fixes.js' index.html
          grep -q 'site-fixes.js' shop.html
          grep -q 'site-fixes.js' cart.html
          grep -q 'site-fixes.js' gallery.html
          grep -q 'site-fixes.js' live.html
          grep -q 'site-fixes.js' contact.html
          grep -q 'site-fixes.js' us.html

      - name: Block committed secrets
        shell: bash
        run: |
          set -e
          if git grep -nE 'sk_live_[A-Za-z0-9]+' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential live Stripe secret found in repository.'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.env|.*\.db|.*\.sqlite3?)$'; then
            echo 'Environment/database file is tracked by Git.'
            exit 1
          fi
