<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>KOSMIK | Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
